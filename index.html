<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.webp" type="image/webp">
<title>Liar原初之星計算器</title>
<meta name="description" content="輸入等級、裝備、技能與遺物，快速算出各賽季的原初之星。">
<style>
@font-face{font-family:"JF Open Huninn";src:url("jf-openhuninn-2_1.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#E0D0F6;--ink:#2a1b4d;--mute:#5e4a8c;--line:#bba5e3;--star:#6c50b9;--btn:#3a2670;--btn-ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"JF Open Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.6;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 20px}
img.logo{width:clamp(130px,20vw,200px);height:auto;margin-bottom:20px}
h1{font-family:inherit;font-weight:700;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.06em;margin:0 0 14px;line-height:1.25}
p{color:var(--mute);margin:0 0 32px;max-width:28em}
.go{display:inline-block;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600;padding:13px 34px;border-radius:999px;font-size:1.05rem}
.go:hover{opacity:.88}
a:focus-visible{outline:3px solid var(--star);outline-offset:3px}
ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding:0;margin:40px 0 0}
li a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
li a:hover{color:var(--ink);border-color:var(--star)}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:16px;position:relative;z-index:1}
main{position:relative;z-index:1}
.mascot-box{position:fixed;right:0;bottom:0;width:clamp(150px,30vw,400px);z-index:2;pointer-events:none}
.mascot-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.mascot{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mascot-box{--bw:clamp(160px,27vw,320px)}
.bubble{position:absolute;right:46%;bottom:74%;width:var(--bw);height:auto;transform-origin:15% 100%;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .18s,transform .28s cubic-bezier(.34,1.56,.64,1)}
.bubble.b2{width:calc(var(--bw)*.6016);right:calc(46% + var(--bw)*.243)}
.bubble.show{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:reduce){.bubble{transition:opacity .1s;transform:none}}
@media (max-width:640px){main{padding-bottom:150px}}
</style>
</head>
<body>
<div class="mascot-box">
 <img class="bubble b1" src="bubble.webp" alt="這都不會算嗎..." width="700" height="422" aria-hidden="true">
 <img class="bubble b2" src="bubble2.webp" alt="白癡..." width="421" height="253" aria-hidden="true">
 <button class="mascot-btn" id="mascot" type="button" aria-label="點一下和 Liar 說話"><img class="mascot" src="liar.webp" alt="" width="800" height="740"></button>
</div>
<main>
 <img class="logo" src="logo.webp" alt="SSSTUDIO" width="674" height="700">
 <h1>Liar原初之星計算器</h1>
 <p>輸入等級、裝備、技能與遺物，算出各賽季累積的原初之星。</p>
 <a class="go" href="yuanchu-calculator.html">開始計算</a>
 <ul aria-label="直接前往">
  <li><a href="yuanchu-calculator.html#S1">S1</a></li>
  <li><a href="yuanchu-calculator.html#S2">S2</a></li>
  <li><a href="yuanchu-calculator.html#S3">S3</a></li>
  <li><a href="yuanchu-calculator.html#S4">S4</a></li>
  <li><a href="yuanchu-calculator.html#S5">S5</a></li>
  <li><a href="yuanchu-tiers.html">原初檔位</a></li>
 </ul>
</main>
<footer>© Liar<br>Made by 三個字</footer>
<script>
(()=>{const bs=[...document.querySelectorAll('.bubble')];let i=0,cur=null,t;
const hide=()=>{if(cur){cur.classList.remove('show');cur.setAttribute('aria-hidden','true');cur=null}};
document.getElementById('mascot').addEventListener('click',()=>{
 if(!cur){cur=bs[i];i=(i+1)%bs.length;cur.classList.add('show');cur.removeAttribute('aria-hidden')}
 clearTimeout(t);t=setTimeout(hide,3000);
});})();
</script>
</body>
</html>
