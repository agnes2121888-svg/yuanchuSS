<style>
@font-face{font-family:"JF Open Huninn";src:url("jf-openhuninn-2_1.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#E0D0F6;--ink:#2a1b4d;--mute:#5e4a8c;--line:#bba5e3;--star:#6c50b9;--btn:#3a2670;--btn-ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"JF Open Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.6;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 20px}
img.logo{width:clamp(130px,20vw,200px);height:auto;margin-bottom:20px}
h1{font-family:inherit;font-weight:700;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.06em;margin:0 0 14px;line-height:1.25}
p{color:var(--mute);margin:0 0 32px;max-width:28em}
.go{display:inline-block;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600;padding:13px 34px;border-radius:999px;font-size:1.05rem}
.go:hover{opacity:.88}
a:focus-visible{outline:3px solid var(--star);outline-offset:3px}
ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding:0;margin:40px 0 0}
li a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
li a:hover{color:var(--ink);border-color:var(--star)}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:16px;position:relative;z-index:1}
main{position:relative;z-index:1}
.mascot{position:fixed;right:0;bottom:0;width:clamp(150px,30vw,400px);height:auto;z-index:0;pointer-events:none;user-select:none}
@media (max-width:640px){main{padding-bottom:150px}.mascot{opacity:.9}}
</style>
</head>
