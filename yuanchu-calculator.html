<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原初之星計算器</title>
<style>
@font-face{font-family:"JF Open Huninn";src:url("jf-openhuninn-2_1.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#E0D0F6;--card:#f7f2fd;--ink:#2a1b4d;--mute:#5e4a8c;--line:#cbb8ec;--acc:#6c50b9;--btn:#3a2670;--in:#fff;--out:#ece1fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JF Open Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 16px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.95rem}
nav button.on{background:var(--btn);border-color:var(--btn);color:#fff}
nav button,input{font-family:inherit}
.back{display:inline-block;margin-bottom:10px;color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{width:130px;font-weight:600}
.grp{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:200px}
input[type=number]{width:86px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--in);color:var(--ink);font-size:.95rem}
.pt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700;min-width:90px;text-align:right}
.note{color:var(--mute);font-size:.82rem}
.note a{color:var(--acc)}
.res{background:var(--out)}
.res .row{border-color:transparent}
.big{font-size:1.6rem;font-weight:800;color:var(--acc)}
.over{color:#2f7a4f;font-weight:700}.under{color:#c53030;font-weight:700}
table{border-collapse:collapse;width:100%}
.wrap{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--out)}td:first-child{text-align:left;font-weight:600}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← 返回首頁</a>
<h1>原初之星計算器</h1>
<p class="sub">只需修改白色輸入格內的數字，結果會即時計算。</p>
<nav id="tabs"></nav>
<div id="view"></div>
</main>
<script>
const N=(n,v)=>Array(n).fill(v);
// 各賽季參數：base=扣除基準, k=每級積分
const SEASONS=[
{id:'S2',lv:130,pet:[520,8],eq:[650,18],sk:[1040,7],re:[260,33],div:27,add:45,prior:200,pl:'S1 已有原初之星',unit:'萬',
 cur:[180,1441,1489],pets:N(4,182),eqs:N(5,190),sks:N(8,180),res:N(20,18)},
{id:'S3',lv:160,pet:[640,6],eq:[800,14],sk:[1280,5],re:[320,26],div:13,add:65,prior:1151,pl:'S1+S2 已有原初之星',unit:'萬',target:3440,
 cur:[257,6714,10700],pets:N(4,230),eqs:N(5,275),sks:N(8,250),res:N(20,28)},
{id:'S4',lv:190,pet:[760,11],eq:[950,17],sk:[1520,5],re:[380,28],div:7,add:120,prior:3792,pl:'S1+S2+S3 已有原初之星',unit:'萬',target:8040,
 cur:[307,10400,15200],pets:N(4,270),eqs:N(5,330),sks:[306,306,307,306,306,306,306,306],
 res:[32,32,32,32,31,31,31,31,32,32,31,31,31,31,31,31,31,31,32,32]},
{id:'S5',lv:220,pet:[880,12],eq:[1100,18],sk:[1760,6],re:[440,30],div:4,add:150,prior:9474,pl:'已有原初之星',unit:'億',
 cur:[320,76.3,99.6],pets:N(4,290),eqs:N(5,380),sks:N(8,340),res:N(20,34)}
];
const fmt=n=>Math.round(n).toLocaleString('en-US');
const $=s=>document.querySelector(s);
const tabs=['S1','S2','S3','S4','S5'];
let cur='S1';

function nums(id,arr){return arr.map((v,i)=>`<input type=number step=any data-g="${id}" value="${v}">`).join('')}
function sumOf(id){return [...document.querySelectorAll(`[data-g="${id}"]`)].reduce((a,e)=>a+(+e.value||0),0)}
function row(label,id,arr,pid,note){return `<div class=row><div class=lab>${label}${note?`<div class=note>${note}</div>`:''}</div><div class=grp>${nums(id,arr)}</div><div class=pt id=${pid}></div></div>`}

function targetRow(def){return `<div class=row><div class=lab>目標原初之星</div><div class=grp><input type=number step=any data-g=target placeholder="輸入目標" value="${def??''}"></div><div class=pt id=gap></div></div>`}
function showGap(star){
 const el=document.querySelector('[data-g=target]'),g=$('#gap');
 if(!el||el.value===''){g.innerHTML='<span class=note>輸入目標後顯示</span>';return}
 const d=star-(+el.value);
 g.innerHTML=d>=0?`<span class=over>已超出 ${fmt(d)}</span>`:`<span class=under>還差 ${fmt(-d)}</span>`;
}
function renderS1(){
 $('#view').innerHTML=`<div class=card><b>逢魔賽季</b>
 ${[['等級','a',130],['裝備','b',141],['技能','c',130],['幻獸','d',130],['古遺物','e',13]].map(([l,k,v])=>`<div class=row><div class=lab>${l}</div><div class=grp><input type=number data-g=${k} value=${v}></div><div class=pt id=p${k}></div></div>`).join('')}</div>
 <div class="card res"><div class=row><div class=lab>總共評分</div><div class=pt id=tot></div></div><div class=row><div class=lab>原初之星</div><div class="pt big" id=star></div></div>${targetRow('')}</div>`;
 calc();
}
function renderS(s){
 const u=s.unit;
 $('#view').innerHTML=`<div class=card><b>${s.id} 賽季原初計算</b>
 <div class=row><div class=lab>人物等級<div class=note>等級／實時經驗／升級經驗（${u}）</div></div><div class=grp>${nums('lv',s.cur)}</div><div class=pt id=p0></div></div>
 ${row('四個寵物等級','pet',s.pets,'p1')}${row('五個裝備等級','eq',s.eqs,'p2')}${row('八個技能等級','sk',s.sks,'p3')}${row('20個遺物等級','re',s.res,'p4')}</div>
 <div class="card res">
 <div class=row><div class=lab>${s.id} 總評分</div><div class=pt id=tot></div></div>
 <div class=row><div class=lab>${s.id} 兌換原初之星</div><div class=pt id=raw></div></div>
 <div class=row><div class=lab>取整後原初之星</div><div class=pt id=flo></div></div>
 <div class=row><div class=lab>${s.pl}</div><div class=grp><input type=number data-g=prior value=${s.prior}></div></div>
 <div class=row><div class=lab>總原初之星</div><div class="pt big" id=star></div></div>
 ${targetRow(s.target)}
 <div class=note>公式：總評分 ÷ ${s.div} + ${s.add}，無條件捨去。各賽季檔位請見<a href="yuanchu-tiers.html">原初檔位</a>。</div></div>`;
 calc();
}
function calc(){
 if(cur==='S1'){
  const v=k=>+document.querySelector(`[data-g=${k}]`).value||0;
  const p=[(v('a')-100)*100,(v('b')-100)*38*5,(v('c')-100)*13*8,(v('d')-100)*14*4,(v('e')-10)*57*20];
  ['a','b','c','d','e'].forEach((k,i)=>$('#p'+k).textContent=fmt(p[i]));
  const t=p.reduce((a,b)=>a+b,0);
  $('#tot').textContent=fmt(t);const st=Math.floor(t/100)+10;$('#star').textContent=fmt(st);showGap(st);return;
 }
 const s=SEASONS.find(x=>x.id===cur);
 const [l,d,e]=[...document.querySelectorAll('[data-g=lv]')].map(x=>+x.value||0);
 const p=[(l-s.lv)*100+(e?d/e*100:0),(sumOf('pet')-s.pet[0])*s.pet[1],(sumOf('eq')-s.eq[0])*s.eq[1],(sumOf('sk')-s.sk[0])*s.sk[1],(sumOf('re')-s.re[0])*s.re[1]];
 p.forEach((x,i)=>$('#p'+i).textContent=fmt(x));
 const t=p.reduce((a,b)=>a+b,0),raw=t/s.div+s.add,flo=Math.floor(raw),prior=+document.querySelector('[data-g=prior]').value||0;
 $('#tot').textContent=fmt(t);$('#raw').textContent=raw.toFixed(2);$('#flo').textContent=fmt(flo);$('#star').textContent=fmt(prior+flo);showGap(prior+flo);
}
function show(t){
 cur=t;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 t==='S1'?renderS1():renderS(SEASONS.find(x=>x.id===t));
}
$('#tabs').innerHTML=tabs.map(t=>`<button data-t="${t}">${t}</button>`).join('');
$('#tabs').addEventListener('click',e=>{if(e.target.dataset.t)show(e.target.dataset.t)});
document.addEventListener('input',e=>{if(e.target.matches('input'))calc()});
const h=decodeURIComponent(location.hash.slice(1));
show(tabs.includes(h)?h:'S2');
</script>
</body>
</html>
